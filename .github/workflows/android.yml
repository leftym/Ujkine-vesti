name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Build web bundle and sync into the Android project
        run: |
          npm run build:web
          npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PvCode=${{ github.run_number }} \
            -PvName=1.0.${{ github.run_number }}

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Vesti.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vesti-apk
          path: Vesti.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Vesti.apk \
            --title "Vesti 1.0.${{ github.run_number }}" \
            --notes "Download Vesti.apk on the phone and open it to install (allow 'install unknown apps' for the browser if asked)." \
            --latest
