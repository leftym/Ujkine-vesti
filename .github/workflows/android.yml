name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *'   # daily 05:30 Hawaii time: health report for the review agent

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Build web bundle and sync into the Android project
        run: |
          npm run build:web
          npx cap sync android

      - name: Build signed release APK
        shell: bash
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain \
            -PvCode=${{ github.run_number }} \
            -PvName=1.0.${{ github.run_number }} 2>&1 | tee ../gradle.log

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Vesti.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vesti-apk
          path: Vesti.apk

      - name: Publish build summary to ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "# APK build run ${{ github.run_number }}: $JOB_STATUS"
            echo "commit: ${{ github.sha }}"
            echo
            echo '```'
            tail -n 150 gradle.log 2>/dev/null || echo "(no gradle log: build did not get that far)"
            echo '```'
          } > apk-build.md
          scripts/publish-ci-log.sh apk-build.md apk-build.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Vesti.apk \
            --title "Vesti 1.0.${{ github.run_number }}" \
            --notes "Download Vesti.apk on the phone and open it to install (allow 'install unknown apps' for the browser if asked)." \
            --latest

  feed-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the six live feeds
        run: node scripts/feed-check.js feed-check.md
      - name: Health report for the review agent
        run: node scripts/health-report.js health.md
      - name: Publish reports to ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/publish-ci-log.sh feed-check.md feed-check.md
          [ -f health.md ] && scripts/publish-ci-log.sh health.md health.md
          [ -f health.md ] && scripts/publish-ci-log.sh health.md "history/health-$(date -u +%F).md"
          exit 0
