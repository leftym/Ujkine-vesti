name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Health reports for the review agent. Times are UTC and fixed; Serbia shifts by one hour with daylight saving.
    - cron: '30 3 * * *'    # 04:30 Serbia (winter) / 05:30 (summer), 17:30 Hawaii: BEFORE the relative's morning, so problems are visible the evening before
    - cron: '0 16 * * *'    # 17:00 Serbia (winter) / 18:00 (summer), 06:00 Hawaii: fresh for the 08:15 Hawaii review

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

# A scheduled health check must not cancel an APK build (or the other way round)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'health' || 'build' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Build web bundle and sync into the Android project
        run: |
          npm run build:web
          npx cap sync android

      - name: Build signed release APK
        shell: bash
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain \
            -PvCode=${{ github.run_number }} \
            -PvName=1.0.${{ github.run_number }} 2>&1 | tee ../gradle.log

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk UjkineVesti.apk

      # Play Store variant: same keystore and applicationId, no outlet logos. Kept as an artifact only,
      # it is not attached to the public release.
      - name: Build Play bundle (store variant)
        continue-on-error: true   # a problem here must never stop the family APK release
        run: |
          STORE_BUILD=1 npm run build:web
          npx cap sync android
          cd android
          ./gradlew bundleRelease --no-daemon --console=plain \
            -PvCode=${{ github.run_number }} -PvName=1.0.${{ github.run_number }}
          cd ..
          cp android/app/build/outputs/bundle/release/app-release.aab UjkineVesti.aab
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: UjkineVesti-aab
          path: UjkineVesti.aab

      - uses: actions/upload-artifact@v4
        with:
          name: UjkineVesti-apk
          path: UjkineVesti.apk

      - name: Publish build summary to ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "# APK build run ${{ github.run_number }}: $JOB_STATUS"
            echo "commit: ${{ github.sha }}"
            echo
            echo '```'
            tail -n 150 gradle.log 2>/dev/null || echo "(no gradle log: build did not get that far)"
            echo '```'
          } > apk-build.md
          scripts/publish-ci-log.sh apk-build.md apk-build.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" UjkineVesti.apk \
            --title "Ujkine Vesti 1.0.${{ github.run_number }}" \
            --notes "Download UjkineVesti.apk on the phone and open it to install (allow 'install unknown apps' for the browser if asked)." \
            --latest

  feed-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the six live feeds
        run: node scripts/feed-check.js feed-check.md
      - name: Probe outlet icons
        continue-on-error: true
        run: node scripts/probe-icons.js icons.md
      - name: Probe (B92 feeds, YouTube links and channels)
        continue-on-error: true
        run: node scripts/probe.js probe.md
      - name: Health report for the review agent
        run: node scripts/health-report.js health.md
      - name: Publish reports to ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/publish-ci-log.sh feed-check.md feed-check.md
          [ -f icons.md ] && scripts/publish-ci-log.sh icons.md icons.md
          [ -f probe.md ] && scripts/publish-ci-log.sh probe.md probe.md
          [ -f health.md ] && scripts/publish-ci-log.sh health.md health.md
          [ -f health.md ] && scripts/publish-ci-log.sh health.md "history/health-$(date -u +%Y-%m-%dT%H)Z.md"
          exit 0
