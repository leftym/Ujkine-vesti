<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<title>Ujkine Vesti</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>Ujkine Vesti</h1>
  <div class="actions">
    <button id="fsDown" class="icon txt" aria-label="Manja slova">A&minus;</button>
    <button id="fsUp" class="icon txt" aria-label="Veća slova">A+</button>
    <button id="refresh" class="icon" aria-label="Osveži">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    <button id="openSettings" class="icon" aria-label="Podešavanja">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </div>
</header>

<nav class="tabs" aria-label="Prikaz">
  <button id="tabNews" class="tab" type="button" aria-pressed="true">Vesti</button>
  <button id="tabVideo" class="tab" type="button" aria-pressed="false">Video</button>
</nav>

<div id="ytrow" class="ytrow" hidden>
  <button id="ytOpen" class="ytopen" type="button">▶  Otvori YouTube</button>
</div>

<div class="filters">
  <div class="chips" id="srcChips" role="group" aria-label="Izvori"></div>
  <button id="moreBtn" class="morebtn" type="button" aria-expanded="false">Teme i pretraga ▾</button>
  <div id="morePanel" hidden>
    <div class="chips" id="catChips" role="group" aria-label="Teme"></div>
    <input id="q" type="search" placeholder="Pretraži vesti…" enterkeyhint="search" autocomplete="off" aria-label="Pretraga">
  </div>
  <div class="chips" id="vidChips" role="group" aria-label="Vrsta snimaka" hidden></div>
</div>

<p id="status" class="status" aria-live="polite">Učitavanje…</p>
<main id="list"></main>
<div class="more"><button id="more" hidden>Prikaži još</button></div>

<dialog id="reader" aria-label="Čitač">
  <div class="sheet-bar">
    <button id="closeReader" class="icon" aria-label="Zatvori">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <span class="rfs">
      <button id="rFsDown" class="icon txt" type="button" aria-label="Manja slova">A&minus;</button>
      <button id="rFsUp" class="icon txt" type="button" aria-label="Veća slova">A+</button>
    </span>
    <button id="shareBtn" class="btn share" type="button">Podeli</button>
  </div>
  <article id="readerBody"></article>
  <div class="reader-foot">
    <a id="openOriginal" class="btn" target="_blank" rel="noopener noreferrer">Otvori original na sajtu ↗</a>
  </div>
</dialog>

<dialog id="settings" aria-label="Podešavanja">
  <div class="sheet-bar">
    <strong>Podešavanja</strong>
    <button id="closeSettings" class="icon" aria-label="Zatvori">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="settings-body">
    <fieldset class="theme">
      <legend>Pismo</legend>
      <label class="row"><input type="radio" name="script" value="lat"> <span>Latinica</span></label>
      <label class="row"><input type="radio" name="script" value="cyr"> <span>Ćirilica</span></label>
    </fieldset>
    <fieldset class="theme">
      <legend>Izgled ekrana</legend>
      <label class="row"><input type="radio" name="theme" value="auto"> <span>Kao telefon (automatski)</span></label>
      <label class="row"><input type="radio" name="theme" value="light"> <span>Svetao</span></label>
      <label class="row"><input type="radio" name="theme" value="dark"> <span>Taman</span></label>
    </fieldset>
    <label class="row"><input type="checkbox" id="optImages"> <span>Prikaži slike uz vesti</span></label>
    <label class="row"><input type="checkbox" id="optLogos"> <span>Prikaži znak (logo) medija pored imena</span></label>
    <label class="row"><input type="checkbox" id="optSummary"> <span>Prikaži kratak opis ispod naslova</span></label>
    <label class="row"><input type="checkbox" id="optAds"> <span>Sakrij oglase i sponzorisane tekstove</span></label>
    <label class="row"><input type="checkbox" id="optBetting"> <span>Sakrij kladionice i kvote</span></label>
    <label class="row"><input type="checkbox" id="optReader"> <span>Čitaj u aplikaciji (bez reklama)</span></label>
    <label class="col"><span>Sakrij vesti koje sadrže (reči odvojene zarezom)</span>
      <textarea id="optMuted" rows="3" placeholder="rijaliti, horoskop, zadruga"></textarea>
    </label>
    <button type="button" id="reportBtn" class="btn">Javi problem Dušanu</button>
    <p class="hint">Otvara se lista aplikacija. Izaberi Viber i Dušana, pa pošalji.</p>
    <h2>Da li izvori rade</h2>
    <ul id="diag" class="diag"></ul>
  </div>
</dialog>

<script src="/cyr.js"></script>
<script src="/app.js"></script>
</body>
</html>
